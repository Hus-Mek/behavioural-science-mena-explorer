# Installed by pr-gate. The gate itself lives in Hus-Mek/pr-gate-action; move its v1 tag to update every repo.
name: pr-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: Hus-Mek/pr-gate-action/.github/workflows/gate.yml@v1
    with:
      gate_ref: v1
    secrets: inherit
